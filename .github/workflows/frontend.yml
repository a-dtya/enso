name: Frontend CI

on:
  push:
    paths:
      - "connectpro-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "connectpro-frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: connectpro-frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present
